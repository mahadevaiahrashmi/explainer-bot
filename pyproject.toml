[project]
name = "content"
version = "0.1.0"
description = "Chatbot that turns rough points into a narrated explainer video"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "playwright>=1.49",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "httpx>=0.27",      # used to talk to Ollama, and as the `llm` cloud backend
    "llm>=0.19",        # provider-agnostic CLI used by the "llm" backend
    "llm-anthropic",    # Anthropic plugin for `llm` so cloud Claude works out of the box
]

[tool.uv]
package = false
